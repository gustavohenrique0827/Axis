name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
