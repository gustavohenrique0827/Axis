<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#0d1117"/>

  <!-- Bar 1 (shortest, darkest brown) -->
  <rect x="8" y="38" width="13" height="18" rx="2" fill="#7c3a1e"/>

  <!-- Bar 2 (medium, medium orange) -->
  <rect x="25" y="28" width="13" height="28" rx="2" fill="#c0521f"/>

  <!-- Bar 3 (tallest, brightest orange) -->
  <rect x="42" y="16" width="13" height="40" rx="2" fill="#e8622a"/>

  <!-- White growth curve -->
  <path d="M10 48 Q28 24 54 14" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Plus sign (white) -->
  <line x1="55" y1="7" x2="55" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="10" x2="58" y2="10" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
